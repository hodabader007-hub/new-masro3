<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي التفاعلي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f0f0f0;
            color: #333;
            transition: background-color 0.5s;
        }
        h1 {
            font-size: 36px;
            color: #2c3e50;
        }
        h1 span {
            display: block;
            font-size: 18px;
            color: gray;
            margin-top: 5px;
        }
        p {
            font-size: 16px;
        }
        a {
            color: #2980b9;
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: #e74c3c;
        }
        img {
            max-width: 400px;
            margin-top: 20px;
            border-radius: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            max-width: 400px;
        }
        input, textarea {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>
        مرحباً بكم في موقعي التفاعلي!
        <span>تجربة أول مشروع تفاعلي باستخدام HTML وCSS وJS</span>
    </h1>

    <p>اضغط على الزر لتغيير لون خلفية الصفحة:</p>
    <button onclick="changeBackground()">تغيير اللون</button>

    <img src="https://via.placeholder.com/400" alt="صورة توضيحية">

    <p>زوروا <a href="https://www.google.com" target="_blank">هذا الرابط</a> لمزيد من المعلومات.</p>

    <form onsubmit="submitForm(event)">
        <input type="text" id="name" placeholder="الاسم" required>
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <textarea id="message" placeholder="رسالتك" rows="4" required></textarea>
        <button type="submit">إرسال</button>
    </form>

    <script>
        function changeBackground() {
            const colors = ['#f0f0f0', '#ffe4e1', '#e0ffff', '#f5f5dc', '#d3ffd3'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
        }

        function submitForm(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة
            const name = document.getElementById('name').value;
            alert(`شكراً لك ${name} على رسالتك!`);
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
